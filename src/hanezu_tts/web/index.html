<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>朱華TTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700&amp;family=Open+Sans:wght@400;500;600;700&amp;display=swap">
<style>
  :root {
    font-family: "Open Sans", "M PLUS 1p", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    --hanezu: #e8826b;
    --hanezu-deep: #c75f4a;
    --bg: #fbf7f5;
    --panel: #ffffff;
    --text: #2b2422;
    --muted: #7b6e6a;
    --line: #eadfdb;
    --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1817;
      --panel: #262120;
      --text: #f2ebe8;
      --muted: #a89a95;
      --line: #3a3230;
      --error: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    line-height: 1.6;
  }
  button, input, select, textarea { font: inherit; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: .04em; }
  h1 span { color: var(--hanezu); }
  header small { color: var(--muted); }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  textarea {
    width: 100%; min-height: 140px; resize: vertical; padding: 12px; font: inherit;
    border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit;
  }
  textarea:focus, input[type=number]:focus { outline: 2px solid var(--hanezu); outline-offset: 1px; }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-top: 4px; }
  .speed { margin-top: 18px; }
  .speed-row { display: flex; align-items: center; gap: 12px; }
  input[type=range] { flex: 1; accent-color: var(--hanezu); }
  input[type=number] {
    width: 84px; padding: 6px 8px; font: inherit; border-radius: 8px;
    border: 1px solid var(--line); background: transparent; color: inherit;
  }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .presets button {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 999px; padding: 2px 10px; font-size: 13px; cursor: pointer;
  }
  .presets button.active { border-color: var(--hanezu); color: var(--hanezu-deep); }
  .actions { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
  #generate {
    background: var(--hanezu); color: #fff; border: 0; border-radius: 10px;
    padding: 10px 22px; font: inherit; font-weight: 600; cursor: pointer;
  }
  #generate:hover { background: var(--hanezu-deep); }
  #generate:disabled { opacity: .6; cursor: progress; }
  #status { color: var(--muted); font-size: 14px; }
  #status.error { color: var(--error); }
  .history { margin-top: 24px; display: grid; gap: 12px; }
  .item { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .item p { margin: 0 0 8px; overflow-wrap: anywhere; }
  .item .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .item audio { flex: 1; min-width: 220px; height: 36px; }
  .item small { color: var(--muted); }
  .item a { color: var(--hanezu-deep); font-size: 14px; }
</style>
</head>
<body>
<main>
  <header>
    <h1><span>朱華</span>TTS</h1>
    <small>hanezu-tts · 日本語音声合成</small>
  </header>

  <section class="panel">
    <label for="text">テキスト</label>
    <textarea id="text" maxlength="2000">こんにちは。朱華TTSへようこそ。今日はいい天気ですね？</textarea>
    <div class="meta"><span>Ctrl / ⌘ + Enter で生成</span><span id="count">0 / 2000</span></div>

    <div class="speed">
      <label for="speed">速度 (alpha)</label>
      <div class="speed-row">
        <input id="speed" type="range" min="0.5" max="2" step="0.05" value="1">
        <input id="speedValue" type="number" min="0.25" max="4" step="0.05" value="1.00" aria-label="速度">
      </div>
      <div class="presets" id="presets">
        <button type="button" data-v="0.75">0.75×</button>
        <button type="button" data-v="1">1.0×</button>
        <button type="button" data-v="1.25">1.25×</button>
        <button type="button" data-v="1.5">1.5×</button>
      </div>
    </div>

    <div class="actions">
      <button id="generate" type="button">音声を生成</button>
      <span id="status"></span>
    </div>
  </section>

  <section class="history" id="history" aria-live="polite"></section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const text = $("text"), speed = $("speed"), speedValue = $("speedValue");
  const button = $("generate"), status = $("status"), history = $("history");

  const updateCount = () => { $("count").textContent = `${text.value.length} / 2000`; };
  const setSpeed = (value) => {
    const v = Math.min(4, Math.max(0.25, Number(value) || 1));
    speedValue.value = v.toFixed(2);
    speed.value = Math.min(2, Math.max(0.5, v));
    document.querySelectorAll("#presets button").forEach((b) =>
      b.classList.toggle("active", Math.abs(Number(b.dataset.v) - v) < 1e-6));
  };
  speed.addEventListener("input", () => setSpeed(speed.value));
  speedValue.addEventListener("change", () => setSpeed(speedValue.value));
  document.querySelectorAll("#presets button").forEach((b) =>
    b.addEventListener("click", () => setSpeed(b.dataset.v)));
  text.addEventListener("input", updateCount);
  try {
    const saved = localStorage.getItem("hanezu-speed");
    if (saved) setSpeed(saved); else setSpeed(1);
  } catch { setSpeed(1); }
  updateCount();

  async function generate() {
    const body = { text: text.value.trim(), speed: Number(speedValue.value) };
    if (!body.text) { status.textContent = "テキストを入力してください"; status.className = "error"; return; }
    try { localStorage.setItem("hanezu-speed", String(body.speed)); } catch {}
    button.disabled = true;
    status.className = "";
    status.textContent = "生成中…";
    const started = performance.now();
    try {
      const response = await fetch("inference", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!response.ok) {
        let detail = response.statusText;
        try { const j = await response.json(); detail = typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail); } catch {}
        throw new Error(detail);
      }
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const seconds = Number(response.headers.get("X-Audio-Seconds") || 0);
      const elapsed = (performance.now() - started) / 1000;
      addItem(body, url, seconds, elapsed);
      status.textContent = `完了 (${elapsed.toFixed(2)} 秒)`;
    } catch (error) {
      status.textContent = `エラー: ${error.message}`;
      status.className = "error";
    } finally {
      button.disabled = false;
    }
  }

  function addItem(body, url, seconds, elapsed) {
    const item = document.createElement("article");
    item.className = "item";
    const p = document.createElement("p");
    p.textContent = body.text;
    const row = document.createElement("div");
    row.className = "row";
    const audio = document.createElement("audio");
    audio.controls = true; audio.src = url; audio.autoplay = true;
    const info = document.createElement("small");
    info.textContent = `${body.speed.toFixed(2)}× · ${seconds.toFixed(2)} 秒 · 生成 ${elapsed.toFixed(2)} 秒`;
    const link = document.createElement("a");
    link.href = url; link.download = `hanezu-${Date.now()}.wav`; link.textContent = "保存";
    row.append(audio, info, link);
    item.append(p, row);
    history.prepend(item);
    while (history.children.length > 10) {
      const old = history.lastElementChild;
      const src = old.querySelector("audio")?.src;
      if (src) URL.revokeObjectURL(src);
      old.remove();
    }
  }

  button.addEventListener("click", generate);
  text.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); generate(); }
  });
})();
</script>
</body>
</html>
